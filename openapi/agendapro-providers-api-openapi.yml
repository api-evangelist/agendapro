openapi: 3.2.0
info:
  title: Connect v3 Providers API
  version: 3.0.0
  description: Public API gateway for AgendaPro.
servers:
- url: https://connect.agendapro.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Providers
  description: Service provider listing and details
paths:
  /v3/providers:
    get:
      operationId: listProviders
      summary: List Providers
      description: 'This endpoint returns a paginated list of service providers for the company.


        ### Errors Dictionary


        | **Status** | **Error** | **Detail** | **Description** |

        | --- | --- | --- | --- |

        | 401 | unauthorized | invalid_api_key | Missing or invalid Bearer token. |

        | 401 | unauthorized | api_config_inactive | API access is inactive for this company. |

        | 403 | forbidden | scope_denied | API key lacks `providers:read` scope. |

        | 429 | rate_limited | burst_limit_exceeded | Per-minute request limit exceeded. |

        | 429 | rate_limited | daily_quota_exceeded | Daily request quota exceeded. |

        | 502 | upstream_unavailable | | The upstream service is unavailable. |'
      tags:
      - Providers
      parameters:
      - name: location_ids
        in: query
        description: Filter by location IDs (comma-separated).
        required: false
        schema:
          type: array
          items:
            type: integer
        explode: true
      - name: service_ids
        in: query
        description: Filter by service IDs (comma-separated).
        required: false
        schema:
          type: array
          items:
            type: integer
        explode: true
      - name: public_name
        in: query
        description: Filter by provider public name (partial match).
        required: false
        schema:
          type: string
      - name: active
        in: query
        description: Filter by active status.
        required: false
        schema:
          type: boolean
      - name: sort_by
        in: query
        description: Field to sort by.
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Sort order (`asc` or `desc`).
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: page
        in: query
        description: Page number (defaults to 1).
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Records per page (defaults to 30, max 100).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Paginated list of providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
              examples:
                providerList:
                  summary: '[Success] 200 OK - Provider list'
                  value:
                    data:
                    - id: 5
                      company_id: 100
                      location_id: 1
                      active: true
                      public_name: John Stylist
                      online_booking: true
                      images: []
                      provider_open_days: true
                      provider_times:
                      - day: monday
                        start_time: 09:00
                        end_time: '18:00'
                        breaks:
                        - start_time: '13:00'
                          end_time: '14:00'
                    pagination:
                      current_page: 1
                      per_page: 30
                      next_page: null
                      prev_page: null
                      total_records: 1
                      total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v3/providers/{id}:
    get:
      operationId: getProvider
      summary: Get Provider
      description: 'This endpoint returns a single service provider by ID.


        ### Errors Dictionary


        | **Status** | **Error** | **Detail** | **Description** |

        | --- | --- | --- | --- |

        | 401 | unauthorized | invalid_api_key | Missing or invalid Bearer token. |

        | 401 | unauthorized | api_config_inactive | API access is inactive for this company. |

        | 403 | forbidden | scope_denied | API key lacks `providers:read` scope. |

        | 404 | not_found | provider | Provider not found. |

        | 429 | rate_limited | burst_limit_exceeded | Per-minute request limit exceeded. |

        | 429 | rate_limited | daily_quota_exceeded | Daily request quota exceeded. |

        | 502 | upstream_unavailable | | The upstream service is unavailable. |'
      tags:
      - Providers
      parameters:
      - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
components:
  schemas:
    Provider:
      type: object
      description: Service provider resource (filtered for public API).
      properties:
        id:
          type: integer
          format: int64
          description: Unique provider ID.
          example: 5
        company_id:
          type: integer
          description: Company ID.
          example: 100
        location_id:
          type: integer
          description: Location ID.
          example: 1
        active:
          type: boolean
          description: Whether the provider is active.
          example: true
        public_name:
          type: string
          description: Provider display name.
          example: John Stylist
        online_booking:
          type: boolean
          description: Whether online booking is enabled for this provider.
          example: true
        images:
          type: array
          description: Provider images.
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              url:
                type: string
                example: https://cdn.example.com/providers/5/img1.jpg
              thumbnail_url:
                type: string
                example: https://cdn.example.com/providers/5/thumb1.jpg
            required:
            - id
            - url
            - thumbnail_url
        provider_open_days:
          type: boolean
          description: Whether the provider has open days configured.
          example: true
        provider_times:
          type: array
          description: Provider working schedule.
          items:
            $ref: '#/components/schemas/ProviderTime'
      required:
      - id
      - company_id
      - location_id
      - active
      - public_name
      - online_booking
      - images
      - provider_open_days
      - provider_times
    ErrorDetailResponse:
      type: object
      description: 'Standard error response.

        The `error` field contains the error type and the `detail` field

        provides additional context.

        '
      properties:
        error:
          type: string
          description: Error type identifier.
          example: unauthorized
        detail:
          type:
          - string
          - 'null'
          description: Additional context about the error.
          example: invalid_api_key
      required:
      - error
    ProviderListResponse:
      type: object
      description: Paginated provider list response.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
      required:
      - pagination
      - data
    ProviderTime:
      type: object
      description: Provider working hours for a day.
      properties:
        day_id:
          type: integer
          description: Day of the week (0=Sunday, 1=Monday, ..., 6=Saturday).
          example: 1
        open:
          type: string
          description: Opening time (HH:MM).
          example: 09:00
        close:
          type: string
          description: Closing time (HH:MM).
          example: '18:00'
        breaks:
          type: array
          description: Break periods during the day.
          items:
            type: object
            properties:
              open:
                type: string
                example: '13:00'
              close:
                type: string
                example: '14:00'
      required:
      - day_id
      - open
      - close
    Pagination:
      type: object
      description: Pagination metadata.
      properties:
        current_page:
          type: integer
          minimum: 1
          description: Current page.
          example: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: Records per page.
          example: 30
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Next page number, or null on the last page.
          example: 2
        prev_page:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Previous page number, or null on the first page.
          example: null
        total_records:
          type: integer
          minimum: 0
          description: Total records.
          example: 95
        total_pages:
          type: integer
          minimum: 0
          description: Total pages.
          example: 4
      required:
      - current_page
      - per_page
      - next_page
      - prev_page
      - total_records
      - total_pages
  responses:
    UpstreamUnavailable:
      description: Upstream service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            upstreamUnavailable:
              summary: '[Error] 502 Bad Gateway - Upstream unavailable'
              value:
                error: upstream_unavailable
                detail: The upstream service is unavailable
    Unauthorized:
      description: Missing or invalid Bearer API key, or inactive API configuration.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            invalidApiKey:
              summary: '[Error] 401 Unauthorized - Invalid API key'
              value:
                error: unauthorized
                detail: invalid_api_key
            apiConfigInactive:
              summary: '[Error] 401 Unauthorized - API access inactive'
              value:
                error: unauthorized
                detail: api_config_inactive
    RateLimited:
      description: Rate limit exceeded. Check the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds until the rate limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            burstLimitExceeded:
              summary: '[Error] 429 Too Many Requests - Burst limit'
              value:
                error: rate_limited
                detail: burst_limit_exceeded
            dailyQuotaExceeded:
              summary: '[Error] 429 Too Many Requests - Daily quota'
              value:
                error: rate_limited
                detail: daily_quota_exceeded
    Forbidden:
      description: API key lacks the required scope for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            scopeDenied:
              summary: '[Error] 403 Forbidden - Scope denied'
              value:
                error: forbidden
                detail: scope_denied
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            internalError:
              summary: '[Error] 500 Internal Server Error - Internal error'
              value:
                error: internal_error
                detail: unexpected
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetailResponse'
          examples:
            notFound:
              summary: '[Error] 404 Not Found - Resource not found'
              value:
                error: not_found
                detail: booking
  parameters:
    ProviderId:
      name: id
      in: path
      required: true
      description: Provider unique identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key issued per company. Pass as Authorization: Bearer <key>.'
