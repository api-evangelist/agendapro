aid: agendapro
name: AgendaPro
description: AgendaPro is a Latin American vertical SaaS platform for appointment-based service businesses — salons,
  barbershops, spas, aesthetic and medical clinics, gyms, veterinarians and wellness studios — combining online
  booking, calendar and staff scheduling, client CRM and treatment records, point of sale, inventory, commissions,
  marketing campaigns and WhatsApp/SMS/email reminders, plus online payments and gift cards. Founded in Chile and
  operating across Chile, Mexico, Colombia, Peru, Argentina, Brazil and Spain, it serves multi-location merchants
  from a single account. Its public developer surface is the Connect v3 API, an OpenAPI 3.0.3-described REST gateway
  at connect.agendapro.com that exposes bookings, availability slots, clients, custom attributes, locations, services,
  categories, service providers, sales, carts and online payment requests, with Bearer API-key auth, scoped keys,
  per-minute and per-day rate limiting, and HMAC-signed webhooks. API access requires an active Pro plan.
