apis:
- name: AgendaPro Connect v3 API
  description: 'Public REST API gateway for AgendaPro. Authenticates external developers with a per-company Bearer
    API key, enforces scopes and rate limits, and proxies to internal services. 28 operations across 11 resources:
    available slots, bookings, clients, client custom attributes, custom attribute templates, locations, services,
    categories, providers, sales, carts and payment requests. Paginated list responses, a flat {error, detail} error
    envelope, and HMAC-SHA256 signed webhooks for booking, client and payment-request events. Requires an active
    Pro plan.'
