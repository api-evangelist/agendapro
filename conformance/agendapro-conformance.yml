domain_standard:
  declared: false
  candidate_standards_probed:
  - schema.org/Reservation
  - schema.org/Service
  - OpenActive (activity booking)
  - HL7 FHIR Appointment
  note: The scheduling / appointment-booking market AgendaPro serves has no standard the contract declares. Nothing
    in the OpenAPI carries a schema.org @type, an OpenActive context, an ICS/iCalendar surface or a FHIR Appointment
    resource shape; the booking, client and service models are entirely proprietary. This is a reward-only dimension
    and no penalty is implied — the finding is recorded so a later round does not re-probe it, and so that an integrator
    knows a bespoke connector is required. Note that the aesthetic and medical-clinic segment AgendaPro sells into
    is where a FHIR Appointment mapping would matter most, and none is offered.
