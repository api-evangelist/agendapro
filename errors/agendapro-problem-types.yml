format: vendor
rfc9457: false
rfc9457_note: AgendaPro does NOT use RFC 9457 problem+json. Every error response is application/json with a flat
  two-field envelope {error, detail}; there is no type URI, title, status or instance member.
envelope:
  media_type: application/json
  schema: ErrorDetailResponse
  fields:
  - name: error
    type: string
    required: true
    description: Machine-readable error class.
  - name: detail
    type: string
    required: false
    description: Additional machine-readable context; empty for some classes.
  example:
    error: unauthorized
    detail: invalid_api_key
error_count: 30
errors:
- status: 400
