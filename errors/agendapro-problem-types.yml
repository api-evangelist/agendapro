exceptions:
- name: platform-sales passthrough
  applies_to:
  - createCart
  - updateCart
  - createPaymentRequest
  shape: legacy single-key codes, not {error, detail}
  examples:
  - item_invalid_type
  - invalid_start_time
  - creative_source_not_public
  - company_payments_disabled
  - booking_already_sold
  note: The cart and payment-request endpoints proxy an internal service whose validation errors are passed through
    unchanged, so the error envelope is not uniform across the surface.
notes:
- Every one of the 28 operations declares 401, 403, 429, 500 and 502 responses in the OpenAPI, so the auth, scope,
  rate-limit and upstream classes are universal.
- 'The 422 `restricted` family is merchant-policy enforcement, not client error: the merchant configures edit/cancel
  rules in Configuraciones > Sitio web. The docs instruct integrators to surface these as "the merchant does not
  allow this" rather than retrying.'
