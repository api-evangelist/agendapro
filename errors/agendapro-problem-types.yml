  description: Query string `q` is required.
  remediation: Supply the `q` query string.
  retryable: false
  terminal: false
- status: 400
  error: invalid_body
  detail: expected_object
  description: The request body must be a JSON object. Applies to create and update endpoints.
  remediation: Send a JSON object as the request body.
  retryable: false
  terminal: false
- status: 400
  error: required
  detail: params
  description: No entity filter provided. Supply at least one of `client_id`, `location_id`, `service_id`, or `service_provider_id`.
  remediation: Supply at least one of `client_id`, `location_id`, `service_id` or `service_provider_id`. Dates alone
    do not satisfy the filter requirement.
  retryable: false
  terminal: false
- status: 400
  error: upstream (passthrough)
  description: Item validation errors from platform-sales are passed through with legacy single-key codes (e.g.
    `item_invalid_type`, `invalid_start_time`, `creative_source_not_public`); see the platform-sales carts documentation
    for the full list.
  remediation: Errors proxied from the internal platform-sales service use legacy single-key codes (for example
    `item_invalid_type`, `invalid_start_time`, `creative_source_not_public`, `company_payments_disabled`, `booking_already_sold`)
    and do NOT follow the {error, detail} envelope. Parse defensively.
  retryable: false
  terminal: false
