notes:
- Seven of the twelve core entities are read-only through the public API. The writable surface is bookings, clients,
  carts and payment requests — the API is built for booking and checkout automation, not for catalogue or staff
  administration.
- BookingSale links a Booking to its Sale, which is the only bridge between the scheduling graph and the commerce
  graph.
